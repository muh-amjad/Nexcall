version: '3.9'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: ${DB_SA_PASSWORD:-Nexcall_Dev_P@ss1}
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - nexcall_sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_SA_PASSWORD:-Nexcall_Dev_P@ss1}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./NexcallApi
      dockerfile: NexcallApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=NexcallDb;User Id=sa;Password=${DB_SA_PASSWORD:-Nexcall_Dev_P@ss1};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY:-CHANGE_THIS_TO_A_LONG_SECRET_KEY_FOR_NEXCALL_API_2026_MIN_32_CHARS}
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:8080}
      Jwt__Audience: ${JWT_AUDIENCE:-http://localhost:4200}
      Jwt__ExpiresMinutes: 180
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  ui:
    build:
      context: ./NexcallUI
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  nexcall_sqldata:
